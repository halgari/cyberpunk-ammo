AmmoOverhaul.Smart_20.selectors: ["Items.AO_Feed_20mm_Seekers", "Items.AO_Feed_20mm_Dumbfires", "Items.AO_Feed_20mm_ShortFuse", "Items.AO_Feed_20mm_EMPPayload", "Items.AO_Feed_20mm_FirePayload", "Items.AO_Feed_20mm_ChemPayload", "Items.AO_Feed_20mm_FlashPayload", "Items.AO_Feed_20mm_Hunter", "Items.AO_Feed_20mm_HackCarrier", "Items.AO_Feed_20mm_ShapedCharge"]
