# Power 7.62 (P-762): Ajax, Kyubi, MA70 HB. Common 7.62 Ball; Uncommon 7.62 Mushrooms are hollow points.

AmmoOverhaul.Power_762.family: "Power"
AmmoOverhaul.Power_762.weaponTags: ["Ajax", "Kyubi", "MA70"]
AmmoOverhaul.Power_762.feedSlot: "AttachmentSlots.AO_AmmoFeed_Power_762"
AmmoOverhaul.Power_762.feedElement: "Items.AO_AmmoFeed_Power_762_Element"
AmmoOverhaul.Power_762.defaultAmmo: "Ammo.AO_762_Ball"
AmmoOverhaul.Power_762.vanillaAmmo: "Ammo.RifleAmmo"
AmmoOverhaul.Power_762.lootWeight: 0.35
AmmoOverhaul.Power_762.selectors: ["Items.AO_Feed_762_Ball", "Items.AO_Feed_762_Mushrooms", "Items.AO_Feed_762_PlusP"]
AmmoOverhaul.Power_762.selectorAmmo: ["Ammo.AO_762_Ball", "Ammo.AO_762_HollowPoint", "Ammo.AO_762_PlusP"]
AmmoOverhaul.Power_762.selectorTiers: [0, 1, 1]

# --- Feed slot -------------------------------------------------------------------------------

AttachmentSlots.AO_AmmoFeed_Power_762:
  $base: AttachmentSlots.Power_Handgun_WeaponMod1
  entitySlotName: AO_AmmoFeed_Power_762
  unlockedBy: Common
  localizedName: LocKey#AO-Slot-AmmoFeed

# No quality prereq, so the slot exists on every quality of the gun.
Items.AO_AmmoFeed_Power_762_Element:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.AO_AmmoFeed_Power_762

# --- Ammo --------------------------------------------------------------------------------------

Ammo.AO_762_Ball:
  $base: Ammo.RifleAmmo
  # Listed in full rather than inherited, so the source ammo's weight isn't added on top.
  statModifiers:
    - Ammo.RifleAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.09
  quality: Quality.Common
  displayName: LocKey#AO-Ammo-762-Ball
  localizedDescription: LocKey#AO-Ammo-762-Ball-Desc
  iconPath: AO_762_Ball
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_0, AO_Family_Power]
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.3
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.3

Ammo.AO_762_HollowPoint:
  $base: Ammo.AO_762_Ball
  quality: Quality.Uncommon
  # Uncommon: twice the Common round's price (as weapons roughly double per quality).
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  displayName: LocKey#AO-Ammo-762-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_762_Mushrooms
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]

# --- Icons -------------------------------------------------------------------------------------
# Parts of the mod's icon atlas (tools/icons/build.sh packs it into AmmoOverhaul.archive).

UIIcon.AO_762_Ball:
  $type: UIIcon
  atlasPartName: ao_762_ball
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

UIIcon.AO_762_Mushrooms:
  $type: UIIcon
  atlasPartName: ao_762_mushrooms
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

# --- Selectors ---------------------------------------------------------------------------------

Items.AO_Feed_762_Ball:
  $base: Items.Part
  displayName: LocKey#AO-Ammo-762-Ball
  localizedDescription: LocKey#AO-Ammo-762-Ball-Desc
  iconPath: AO_762_Ball
  itemType: ItemType.Prt_Magazine
  quality: Quality.Common
  placementSlots: [AttachmentSlots.AO_AmmoFeed_Power_762]
  tags: [itemPart, AO_AmmoSelector, HideInBackpackUI]
  buyPrice: []
  sellPrice: []

# Hollow points: harder against flesh, the target's armor counts 1.5x (negative penetration).
Items.AO_Feed_762_Mushrooms:
  $base: Items.AO_Feed_762_Ball
  displayName: LocKey#AO-Ammo-762-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_762_Mushrooms
  quality: Quality.Uncommon
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.CanWeaponIgnoreArmor
      modifierType: Additive
      value: -0.5

# --- Second Uncommon: PlusP ---------------------------------------------------------------

Ammo.AO_762_PlusP:
  $base: Ammo.AO_762_Ball
  quality: Quality.Uncommon
  # Uncommon: twice the Common round's price (as weapons roughly double per quality).
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]
  displayName: LocKey#AO-Ammo-762-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_762_PlusP

UIIcon.AO_762_PlusP:
  $type: UIIcon
  atlasPartName: ao_762_plusp
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

Items.AO_Feed_762_PlusP:
  $base: Items.AO_Feed_762_Ball
  displayName: LocKey#AO-Ammo-762-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_762_PlusP
  quality: Quality.Uncommon
  statModifiers:
    # Over-pressure: more damage and reach, more kick, and each shot costs more stamina.
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.1
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.EffectiveRange
      modifierType: Multiplier
      value: 1.15
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMin
      modifierType: Multiplier
      value: 1.25
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMax
      modifierType: Multiplier
      value: 1.25
    # A factor of the shot's stamina cost (Attacks.Bullet_GameEffect staminaCost).
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.WeaponEvolutionToStaminaCost
      modifierType: Multiplier
      value: 1.3
