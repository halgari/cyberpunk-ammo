# Mod-wide settings, vanilla ammo weights and the 9mm Ball rename. Each caliber has its own file
# (power_9mm.yaml, tech_light.yaml, ...) with its feed slot, ammo items, selectors
# and AmmoOverhaul.<caliber>.* flats.
#
# How the pieces fit (docs/DESIGN.md has the details):
#   - The scriptable tweak (AmmoFeedTweak.reds) sets every weapon carrying one of a caliber's
#     weaponTags to the caliber's defaultAmmo and gives it a clone of its blueprint with the
#     caliber's feed slot added.
#   - The player picks a gun's ammo by installing a selector part in that feed slot. Each
#     selector maps to a real ammo type; an empty slot means defaultAmmo.
#   - The engine copies a gun's ammo from its record into the spawned weapon object. Whenever a
#     managed gun spawns or is drawn, AmmoFeedSystem writes the gun's selection into that copy
#     through the native plugin; the engine then reloads from and consumes that ammo itself.
#
# TweakXL rejects unknown properties on existing record types, so the mod's own settings live in
# the AmmoOverhaul.* flats, keyed by short names, rather than on the item records.

AmmoOverhaul.calibers: ["Power_9mm", "Power_45", "Power_12mm", "Power_556", "Power_762", "Power_127", "Power_12ga",
  "Power_4ga", "Tech_Light",
  "Tech_Heavy", "Smart_10", "Smart_20", "Smart_25"]

# --- Distribution ------------------------------------------------------------------------------
# Share of each tier (Common, Uncommon, Rare, Epic) in a family's ammo, for vendors, world loot
# and NPCs. Gun shops sell up to Rare, other vendors Common only (Vendors.reds); loot rolls any tier.
AmmoOverhaul.shares.Power: [0.80, 0.14, 0.05, 0.01]
AmmoOverhaul.shares.Tech: [0.70, 0.22, 0.07, 0.01]
AmmoOverhaul.shares.Smart: [0.86, 0.10, 0.035, 0.005]

# Chance that converted world loot goes to the caliber of a gun the player carries, rather than
# a caliber picked by the calibers' lootWeight.
AmmoOverhaul.loot.ownedBias: 0.6

# --- Damage roll -------------------------------------------------------------------------------
# Every ranged gun hit, by V or an NPC, is multiplied by a roll (DamageRoll.reds): a dud
# (dudChance, times dudMult), else a hot round (hotChance, times hotMult), else uniform in
# min..max. Layers, first set wins: the round (<ammo>.rollMin, .rollMax, .rollDudChance ...), its
# faction (AmmoOverhaul.roll.<aoFaction>.min ...), its family (below) and these global values.
# Append a damage type for a per-type value (<ammo>.rollMinThermal,
# AmmoOverhaul.roll.Power.minThermal); without one the whole-hit value is used. Below 0 is unset.
AmmoOverhaul.roll.min: 0.90
AmmoOverhaul.roll.max: 1.01
AmmoOverhaul.roll.dudChance: 0.0
AmmoOverhaul.roll.dudMult: 1.0
AmmoOverhaul.roll.hotChance: 0.0
AmmoOverhaul.roll.hotMult: 1.0
AmmoOverhaul.roll.Power.min: -1.0
AmmoOverhaul.roll.Power.max: -1.0
AmmoOverhaul.roll.Power.dudChance: -1.0
AmmoOverhaul.roll.Power.dudMult: -1.0
AmmoOverhaul.roll.Power.hotChance: -1.0
AmmoOverhaul.roll.Power.hotMult: -1.0
AmmoOverhaul.roll.Tech.min: -1.0
AmmoOverhaul.roll.Tech.max: -1.0
AmmoOverhaul.roll.Tech.dudChance: -1.0
AmmoOverhaul.roll.Tech.dudMult: -1.0
AmmoOverhaul.roll.Tech.hotChance: -1.0
AmmoOverhaul.roll.Tech.hotMult: -1.0
AmmoOverhaul.roll.Smart.min: -1.0
AmmoOverhaul.roll.Smart.max: -1.0
AmmoOverhaul.roll.Smart.dudChance: -1.0
AmmoOverhaul.roll.Smart.dudMult: -1.0
AmmoOverhaul.roll.Smart.hotChance: -1.0
AmmoOverhaul.roll.Smart.hotMult: -1.0

# The tooltip's damage range is the base damage times vanilla's 0.9..1.1 roll; ranged guns now
# roll 0.90..1.01, so the max factors become 1.01 (whole hit, then each damage type). Melee
# weapons use other records and keep vanilla's.
Items.Base_Weapon_inline107.value: 1.01
Items.Base_Weapon_Damage_Type_Min_Max_inline3.value: 1.01
Items.Base_Weapon_Damage_Type_Min_Max_inline7.value: 1.01
Items.Base_Weapon_Damage_Type_Min_Max_inline11.value: 1.01
Items.Base_Weapon_Damage_Type_Min_Max_inline15.value: 1.01

# --- Crafting ----------------------------------------------------------------------------------
# Every caliber's Common round is known from the start; Uncommon and up are recipe items
# (Items.AO_Recipe_*, tools/crafting/crafting.py), learned on pickup. Crafting.reds and the loot
# and vendor hooks read these.
# Chance, times the round's own chance, that loot carrying an Uncommon+ round also has its recipe.
AmmoOverhaul.recipeDropFactor: 0.05
# Chance per recipe per restock that a gun shop lists an Uncommon or Rare recipe.
AmmoOverhaul.recipeVendorChance: 0.10
# A recipe item costs this many crafted batches of its round.
AmmoOverhaul.recipePriceBatches: 10

# What every recipe item builds on: vanilla's recipe item (picked up, never shown in the backpack).
Items.AO_RecipeBase:
  $base: Items.EpicUnityRecipe

# --- NPCs --------------------------------------------------------------------------------------
# Magazines of ammo an NPC carries for each gun it draws, by NPC rarity (NpcAmmo.reds). Rounds
# loaded in the gun count toward it; the rest is the body's loot.
AmmoOverhaul.npcMagazines.Trash: 2
AmmoOverhaul.npcMagazines.Weak: 2
AmmoOverhaul.npcMagazines.Normal: 3
AmmoOverhaul.npcMagazines.Rare: 4
AmmoOverhaul.npcMagazines.Officer: 4
AmmoOverhaul.npcMagazines.Elite: 6
AmmoOverhaul.npcMagazines.Boss: 12

# Most a body leaves of each round, in carry points (the round's Weight stat times the count): 6 is
# about an Elite's magazines of rifle ammo. NPCs still carry and fire their full stock; this only
# caps the loot, so an HMG heavy with 1200 rounds of 12.7 leaves 40.
AmmoOverhaul.npcLootWeight: 6.0

# How much likelier than the family's share of a tier an NPC of each rarity is to carry a round of
# that tier (NpcAmmo.RollRound); 0 means never (every rarity is listed so tests can raise one).
# Epic rolls first, then Rare, then Uncommon.
AmmoOverhaul.npcUncommonFactor.Trash: 0.5
AmmoOverhaul.npcUncommonFactor.Weak: 0.5
AmmoOverhaul.npcUncommonFactor.Normal: 1.0
AmmoOverhaul.npcUncommonFactor.Rare: 1.5
AmmoOverhaul.npcUncommonFactor.Officer: 1.5
AmmoOverhaul.npcUncommonFactor.Elite: 2.0
AmmoOverhaul.npcUncommonFactor.Boss: 2.0
AmmoOverhaul.npcRareFactor.Trash: 0.0
AmmoOverhaul.npcRareFactor.Weak: 0.0
AmmoOverhaul.npcRareFactor.Normal: 0.0
AmmoOverhaul.npcRareFactor.Rare: 1.5
AmmoOverhaul.npcRareFactor.Officer: 1.5
AmmoOverhaul.npcRareFactor.Elite: 2.0
AmmoOverhaul.npcRareFactor.Boss: 3.0
AmmoOverhaul.npcEpicFactor.Trash: 0.0
AmmoOverhaul.npcEpicFactor.Weak: 0.0
AmmoOverhaul.npcEpicFactor.Normal: 0.0
AmmoOverhaul.npcEpicFactor.Rare: 0.0
AmmoOverhaul.npcEpicFactor.Officer: 0.0
AmmoOverhaul.npcEpicFactor.Elite: 2.0
AmmoOverhaul.npcEpicFactor.Boss: 4.0

# --- Vanilla ammo ------------------------------------------------------------------------------
# Ammo counts against carry capacity: about one point per typical magazine. Stacks track
# quantity changes, so every shot and pickup updates the carried weight.

# Vanilla handgun ammo is the 9mm Common round.
Ammo.HandgunAmmo:
  displayName: LocKey#AO-Ammo-9mm-Ball
  iconPath: AO_9mm_Ball
  localizedDescription: LocKey#AO-Ammo-9mm-Ball-Desc
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.06

# Vanilla rifle ammo is the 5.56 Common round.
Ammo.RifleAmmo:
  displayName: LocKey#AO-Ammo-556-Ball
  localizedDescription: LocKey#AO-Ammo-556-Ball-Desc
  iconPath: AO_556_Ball
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.06

# Vanilla shotgun ammo is the 12-gauge Common round.
Ammo.ShotgunAmmo:
  displayName: LocKey#AO-Ammo-Buckshot
  localizedDescription: LocKey#AO-Ammo-Buckshot-Desc
  iconPath: AO_12ga_Buckshot
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.06

# Vanilla sniper ammo is the 12.7 Common round: 2.5x the 9mm's weight, twice the price.
Ammo.SniperRifleAmmo:
  displayName: LocKey#AO-Ammo-127-Ball
  localizedDescription: LocKey#AO-Ammo-127-Ball-Desc
  iconPath: AO_127_Ball
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.15
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
