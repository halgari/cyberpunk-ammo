# Power 4-gauge (P-4G): Carnage. Common 4ga Buckshot; Uncommon 4ga Slugs are a hand cannon: the whole shot
# in one heavy slug that knocks the target down (AmmoOverhaul.Slug4ga). They do not pierce cover.

AmmoOverhaul.Power_4ga.family: "Power"
AmmoOverhaul.Power_4ga.weaponTags: ["Carnage"]
AmmoOverhaul.Power_4ga.feedSlot: "AttachmentSlots.AO_AmmoFeed_Power_4ga"
AmmoOverhaul.Power_4ga.feedElement: "Items.AO_AmmoFeed_Power_4ga_Element"
AmmoOverhaul.Power_4ga.defaultAmmo: "Ammo.AO_4ga_Buckshot"
AmmoOverhaul.Power_4ga.vanillaAmmo: "Ammo.ShotgunAmmo"
AmmoOverhaul.Power_4ga.lootWeight: 0.1
AmmoOverhaul.Power_4ga.selectors: ["Items.AO_Feed_4ga_Buckshot", "Items.AO_Feed_4ga_Slugs", "Items.AO_Feed_4ga_Birdshot"]
AmmoOverhaul.Power_4ga.selectorAmmo: ["Ammo.AO_4ga_Buckshot", "Ammo.AO_4ga_Slug", "Ammo.AO_4ga_Birdshot"]
AmmoOverhaul.Power_4ga.selectorTiers: [0, 1, 1]

# --- Feed slot -------------------------------------------------------------------------------

AttachmentSlots.AO_AmmoFeed_Power_4ga:
  $base: AttachmentSlots.Power_Handgun_WeaponMod1
  entitySlotName: AO_AmmoFeed_Power_4ga
  unlockedBy: Common
  localizedName: LocKey#AO-Slot-AmmoFeed

Items.AO_AmmoFeed_Power_4ga_Element:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.AO_AmmoFeed_Power_4ga

# --- Ammo --------------------------------------------------------------------------------------

Ammo.AO_4ga_Buckshot:
  $base: Ammo.ShotgunAmmo
  # Listed in full rather than inherited, so the source ammo's weight isn't added on top.
  statModifiers:
    - Ammo.ShotgunAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.15
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  quality: Quality.Common
  displayName: LocKey#AO-Ammo-4ga-Buckshot
  localizedDescription: LocKey#AO-Ammo-4ga-Buckshot-Desc
  iconPath: AO_4ga_Buckshot
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_0, AO_Family_Power]

Ammo.AO_4ga_Slug:
  $base: Ammo.AO_4ga_Buckshot
  quality: Quality.Uncommon
  displayName: LocKey#AO-Ammo-4ga-Slugs
  localizedDescription: LocKey#AO-Ammo-4ga-Slugs-Desc
  iconPath: AO_4ga_Slugs
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]

# --- Icons -------------------------------------------------------------------------------------
# Parts of the mod's icon atlas (tools/icons/build.sh packs it into AmmoOverhaul.archive).

UIIcon.AO_4ga_Buckshot:
  $type: UIIcon
  atlasPartName: ao_4ga_buckshot
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

UIIcon.AO_4ga_Slugs:
  $type: UIIcon
  atlasPartName: ao_4ga_slugs
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

# --- Selectors ---------------------------------------------------------------------------------

Items.AO_Feed_4ga_Buckshot:
  $base: Items.Part
  displayName: LocKey#AO-Ammo-4ga-Buckshot
  localizedDescription: LocKey#AO-Ammo-4ga-Buckshot-Desc
  iconPath: AO_4ga_Buckshot
  itemType: ItemType.Prt_Magazine
  quality: Quality.Common
  placementSlots: [AttachmentSlots.AO_AmmoFeed_Power_4ga]
  tags: [itemPart, AO_AmmoSelector, HideInBackpackUI]
  buyPrice: []
  sellPrice: []

# Slug: one projectile with the whole shot plus 30%, better into armor, more kick, twice the range.
Items.AO_Feed_4ga_Slugs:
  $base: Items.AO_Feed_4ga_Buckshot
  displayName: LocKey#AO-Ammo-4ga-Slugs
  localizedDescription: LocKey#AO-Ammo-4ga-Slugs-Desc
  iconPath: AO_4ga_Slugs
  quality: Quality.Uncommon
  statModifiers:
    # One projectile: take away the gun's pellets (ProjectilesPerShotBase), add one back. refObject Root is
    # the gun; Self would be this part, which has no pellets.
    - !append
      $type: CombinedStatModifier
      statType: BaseStats.ProjectilesPerShot
      modifierType: Additive
      refStat: BaseStats.ProjectilesPerShotBase
      refObject: Root
      opSymbol: '*'
      value: -1
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.ProjectilesPerShot
      modifierType: Additive
      value: 1
    # The engine splits a shot's damage across its projectiles, so the one slug carries all of it.
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadDefaultX
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadDefaultY
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadMaxX
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadMaxY
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsDefaultX
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsDefaultY
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsMaxX
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsMaxY
      modifierType: Multiplier
      value: 0.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.EffectiveRange
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.3
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.CanWeaponIgnoreArmor
      modifierType: Additive
      value: 0.5
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMin
      modifierType: Multiplier
      value: 1.6
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMax
      modifierType: Multiplier
      value: 1.6

# --- On hit ------------------------------------------------------------------------------------
# A 4ga Slug that connects knocks the target down (AmmoFeedSystem.ApplyAmmoOnHit; the engine's
# immunity checks still apply).
AmmoOverhaul.ammoEffects: ["Slug4ga"]
AmmoOverhaul.Slug4ga.ammo: "Ammo.AO_4ga_Slug"
AmmoOverhaul.Slug4ga.effect: "BaseStatusEffect.Knockdown"
AmmoOverhaul.Slug4ga.chance: 1.0

# --- Second Uncommon: Birdshot ---------------------------------------------------------------

Ammo.AO_4ga_Birdshot:
  $base: Ammo.AO_4ga_Buckshot
  quality: Quality.Uncommon
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]
  displayName: LocKey#AO-Ammo-4ga-Birdshot
  localizedDescription: LocKey#AO-Ammo-4ga-Birdshot-Desc
  iconPath: AO_4ga_Birdshot

UIIcon.AO_4ga_Birdshot:
  $type: UIIcon
  atlasPartName: ao_4ga_birdshot
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

Items.AO_Feed_4ga_Birdshot:
  $base: Items.AO_Feed_4ga_Buckshot
  displayName: LocKey#AO-Ammo-4ga-Birdshot
  localizedDescription: LocKey#AO-Ammo-4ga-Birdshot-Desc
  iconPath: AO_4ga_Birdshot
  quality: Quality.Uncommon
  statModifiers:
    # Flinch: HitReactionFactor is 0 on shotguns; vanilla iconics add to it (Buck +1, Tiny Mike +0.4).
    # More pellets (the gun's own count, ProjectilesPerShotBase, times 2.5); the engine splits the
    # shot's damage across them, so each one is weaker.
    - !append
      $type: CombinedStatModifier
      statType: BaseStats.ProjectilesPerShot
      modifierType: Additive
      refStat: BaseStats.ProjectilesPerShotBase
      refObject: Root
      opSymbol: '*'
      value: 1.5
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadDefaultX
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadDefaultY
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadMaxX
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadMaxY
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsDefaultX
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsDefaultY
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsMaxX
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.SpreadAdsMaxY
      modifierType: Multiplier
      value: 2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.CanWeaponIgnoreArmor
      modifierType: Additive
      value: -0.5
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.HitReactionFactor
      modifierType: Additive
      value: 0.5
