# Tech heavy rail (T-HEAVY): Burya, Achilles, Nekomata, Rasetsu (tag on one record; the rest matched by
# record), Satara. Common Heavy Rail Slugs; Uncommon Heavy Sleevers are sabot slugs that charge faster.
# Its guns took all four game ammo; heavy rail comes from sniper ammo.

AmmoOverhaul.Tech_Heavy.family: "Tech"
AmmoOverhaul.Tech_Heavy.weaponTags: ["Burya", "Achilles", "Nekomata", "Rasetsu", "Satara"]
AmmoOverhaul.Tech_Heavy.weaponRecords: ["Items.Base_Rasetsu", "Items.Preset_Rasetsu_Prototype", "Items.Base_Tech_Sniper_Rifle", "Items.Preset_Tech_Sniper_Rifle_Default", "Items.Sniper_Nest_Version_Tech_Sniper_Rifle"]
AmmoOverhaul.Tech_Heavy.feedSlot: "AttachmentSlots.AO_AmmoFeed_Tech_Heavy"
AmmoOverhaul.Tech_Heavy.feedElement: "Items.AO_AmmoFeed_Tech_Heavy_Element"
AmmoOverhaul.Tech_Heavy.defaultAmmo: "Ammo.AO_THeavy_Slug"
AmmoOverhaul.Tech_Heavy.vanillaAmmo: "Ammo.SniperRifleAmmo"
AmmoOverhaul.Tech_Heavy.lootWeight: 0.3
AmmoOverhaul.Tech_Heavy.selectors: ["Items.AO_Feed_Heavy_RailSlugs", "Items.AO_Feed_Heavy_Sleevers", "Items.AO_Feed_Heavy_Bricks"]
AmmoOverhaul.Tech_Heavy.selectorAmmo: ["Ammo.AO_THeavy_Slug", "Ammo.AO_THeavy_Sabot", "Ammo.AO_THeavy_Bricks"]
AmmoOverhaul.Tech_Heavy.selectorTiers: [0, 1, 1]

# --- Feed slot -------------------------------------------------------------------------------

AttachmentSlots.AO_AmmoFeed_Tech_Heavy:
  $base: AttachmentSlots.Tech_Handgun_WeaponMod1
  entitySlotName: AO_AmmoFeed_Tech_Heavy
  unlockedBy: Common
  localizedName: LocKey#AO-Slot-AmmoFeed

Items.AO_AmmoFeed_Tech_Heavy_Element:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.AO_AmmoFeed_Tech_Heavy

# --- Ammo --------------------------------------------------------------------------------------

Ammo.AO_THeavy_Slug:
  $base: Ammo.HandgunAmmo
  # Listed in full rather than inherited, so the 9mm weight isn't added on top.
  statModifiers:
    - Ammo.HandgunAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.08
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.5
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.5
  quality: Quality.Common
  displayName: LocKey#AO-Ammo-Heavy-RailSlugs
  localizedDescription: LocKey#AO-Ammo-Heavy-RailSlugs-Desc
  iconPath: AO_Heavy_RailSlugs
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_0, AO_Family_Tech]

Ammo.AO_THeavy_Sabot:
  $base: Ammo.AO_THeavy_Slug
  quality: Quality.Uncommon
  displayName: LocKey#AO-Ammo-Heavy-Sleevers
  localizedDescription: LocKey#AO-Ammo-Sleevers-Desc
  iconPath: AO_Heavy_Sleevers
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Tech]

# --- Icons -------------------------------------------------------------------------------------
# Parts of the mod's icon atlas (tools/icons/build.sh packs it into AmmoOverhaul.archive).

UIIcon.AO_Heavy_RailSlugs:
  $type: UIIcon
  atlasPartName: ao_heavy_railslugs
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

UIIcon.AO_Heavy_Sleevers:
  $type: UIIcon
  atlasPartName: ao_heavy_sleevers
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

# --- Selectors ---------------------------------------------------------------------------------

Items.AO_Feed_Heavy_RailSlugs:
  $base: Items.Part
  displayName: LocKey#AO-Ammo-Heavy-RailSlugs
  localizedDescription: LocKey#AO-Ammo-Heavy-RailSlugs-Desc
  iconPath: AO_Heavy_RailSlugs
  itemType: ItemType.Prt_Magazine
  quality: Quality.Common
  placementSlots: [AttachmentSlots.AO_AmmoFeed_Tech_Heavy]
  tags: [itemPart, AO_AmmoSelector]
  buyPrice: []
  sellPrice: []

# Sabot: charges faster, hits a little softer.
Items.AO_Feed_Heavy_Sleevers:
  $base: Items.AO_Feed_Heavy_RailSlugs
  displayName: LocKey#AO-Ammo-Heavy-Sleevers
  localizedDescription: LocKey#AO-Ammo-Sleevers-Desc
  iconPath: AO_Heavy_Sleevers
  quality: Quality.Uncommon
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.ChargeTime
      modifierType: Multiplier
      value: 0.7
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 0.95

# --- Second Uncommon: Bricks ---------------------------------------------------------------

Ammo.AO_THeavy_Bricks:
  $base: Ammo.AO_THeavy_Slug
  quality: Quality.Uncommon
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Tech]
  displayName: LocKey#AO-Ammo-Heavy-Bricks
  localizedDescription: LocKey#AO-Ammo-Bricks-Desc
  iconPath: AO_Heavy_Bricks

UIIcon.AO_Heavy_Bricks:
  $type: UIIcon
  atlasPartName: ao_heavy_bricks
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

Items.AO_Feed_Heavy_Bricks:
  $base: Items.AO_Feed_Heavy_RailSlugs
  displayName: LocKey#AO-Ammo-Heavy-Bricks
  localizedDescription: LocKey#AO-Ammo-Bricks-Desc
  iconPath: AO_Heavy_Bricks
  quality: Quality.Uncommon
  statModifiers:
    # Dense slugs: more damage, slower to charge.
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.15
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.ChargeTime
      modifierType: Multiplier
      value: 1.3
