# --- Feed slot -------------------------------------------------------------------------------

AttachmentSlots.AO_AmmoFeed_Power_12mm:
  $base: AttachmentSlots.Power_Handgun_WeaponMod1
  entitySlotName: AO_AmmoFeed_Power_12mm
  unlockedBy: Common
  localizedName: LocKey#AO-Slot-AmmoFeed

# No quality prereq, so the slot exists on every quality of the gun.
Items.AO_AmmoFeed_Power_12mm_Element:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.AO_AmmoFeed_Power_12mm

# --- Ammo --------------------------------------------------------------------------------------

Ammo.AO_12mm_Ball:
  $base: Ammo.HandgunAmmo
  # Listed in full rather than inherited, so the source ammo's weight isn't added on top.
  statModifiers:
    - Ammo.HandgunAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.12
  quality: Quality.Common
  displayName: LocKey#AO-Ammo-12mm-Ball
  localizedDescription: LocKey#AO-Ammo-12mm-Ball-Desc
  iconPath: AO_12mm_Ball
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_0, AO_Family_Power]
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.6
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.6

Ammo.AO_12mm_HollowPoint:
  $base: Ammo.AO_12mm_Ball
  quality: Quality.Uncommon
  # Uncommon: twice the Common round's price (as weapons roughly double per quality).
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  displayName: LocKey#AO-Ammo-12mm-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_12mm_Mushrooms
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]

