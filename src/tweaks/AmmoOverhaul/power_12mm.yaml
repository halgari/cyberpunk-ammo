# Power 12mm (P-MAG): Nova, Overture, Metel, Malorian 3516 (no family tag: matched by record).
# Common 12mm Ball; Uncommon 12mm Mushrooms are hollow points.

AmmoOverhaul.Power_12mm.family: "Power"
AmmoOverhaul.Power_12mm.weaponTags: ["Nova", "Overture", "Metel"]
AmmoOverhaul.Power_12mm.weaponRecords: ["Items.Preset_Silverhand_3516", "Items.Silverhand_Malorian", "Items.VHard_50_CoolRef_Weapon11"]
AmmoOverhaul.Power_12mm.feedSlot: "AttachmentSlots.AO_AmmoFeed_Power_12mm"
AmmoOverhaul.Power_12mm.feedElement: "Items.AO_AmmoFeed_Power_12mm_Element"
AmmoOverhaul.Power_12mm.defaultAmmo: "Ammo.AO_12mm_Ball"
AmmoOverhaul.Power_12mm.vanillaAmmo: "Ammo.HandgunAmmo"
AmmoOverhaul.Power_12mm.lootWeight: 0.1
AmmoOverhaul.Power_12mm.selectors: ["Items.AO_Feed_12mm_Ball", "Items.AO_Feed_12mm_Mushrooms", "Items.AO_Feed_12mm_PlusP"]
AmmoOverhaul.Power_12mm.selectorAmmo: ["Ammo.AO_12mm_Ball", "Ammo.AO_12mm_HollowPoint", "Ammo.AO_12mm_PlusP"]
AmmoOverhaul.Power_12mm.selectorTiers: [0, 1, 1]

# --- Feed slot -------------------------------------------------------------------------------

AttachmentSlots.AO_AmmoFeed_Power_12mm:
  $base: AttachmentSlots.Power_Handgun_WeaponMod1
  entitySlotName: AO_AmmoFeed_Power_12mm
  unlockedBy: Common
  localizedName: LocKey#AO-Slot-AmmoFeed

# No quality prereq, so the slot exists on every quality of the gun.
Items.AO_AmmoFeed_Power_12mm_Element:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.AO_AmmoFeed_Power_12mm

# --- Ammo --------------------------------------------------------------------------------------

Ammo.AO_12mm_Ball:
  $base: Ammo.HandgunAmmo
  # Listed in full rather than inherited, so the source ammo's weight isn't added on top.
  statModifiers:
    - Ammo.HandgunAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.12
  quality: Quality.Common
  displayName: LocKey#AO-Ammo-12mm-Ball
  localizedDescription: LocKey#AO-Ammo-12mm-Ball-Desc
  iconPath: AO_12mm_Ball
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_0, AO_Family_Power]
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.6
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 1.6

Ammo.AO_12mm_HollowPoint:
  $base: Ammo.AO_12mm_Ball
  quality: Quality.Uncommon
  displayName: LocKey#AO-Ammo-12mm-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_12mm_Mushrooms
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]

# --- Icons -------------------------------------------------------------------------------------
# Parts of the mod's icon atlas (tools/icons/build.sh packs it into AmmoOverhaul.archive).

UIIcon.AO_12mm_Ball:
  $type: UIIcon
  atlasPartName: ao_12mm_ball
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

UIIcon.AO_12mm_Mushrooms:
  $type: UIIcon
  atlasPartName: ao_12mm_mushrooms
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

# --- Selectors ---------------------------------------------------------------------------------

Items.AO_Feed_12mm_Ball:
  $base: Items.Part
  displayName: LocKey#AO-Ammo-12mm-Ball
  localizedDescription: LocKey#AO-Ammo-12mm-Ball-Desc
  iconPath: AO_12mm_Ball
  itemType: ItemType.Prt_Magazine
  quality: Quality.Common
  placementSlots: [AttachmentSlots.AO_AmmoFeed_Power_12mm]
  tags: [itemPart, AO_AmmoSelector]
  buyPrice: []
  sellPrice: []

# Hollow points: harder against flesh, the target's armor counts 1.5x (negative penetration).
Items.AO_Feed_12mm_Mushrooms:
  $base: Items.AO_Feed_12mm_Ball
  displayName: LocKey#AO-Ammo-12mm-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_12mm_Mushrooms
  quality: Quality.Uncommon
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.CanWeaponIgnoreArmor
      modifierType: Additive
      value: -0.5

# --- Second Uncommon: PlusP ---------------------------------------------------------------

Ammo.AO_12mm_PlusP:
  $base: Ammo.AO_12mm_Ball
  quality: Quality.Uncommon
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]
  displayName: LocKey#AO-Ammo-12mm-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_12mm_PlusP

UIIcon.AO_12mm_PlusP:
  $type: UIIcon
  atlasPartName: ao_12mm_plusp
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

Items.AO_Feed_12mm_PlusP:
  $base: Items.AO_Feed_12mm_Ball
  displayName: LocKey#AO-Ammo-12mm-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_12mm_PlusP
  quality: Quality.Uncommon
  statModifiers:
    # Over-pressure: more damage and reach, more kick, and each shot costs more stamina.
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.1
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.EffectiveRange
      modifierType: Multiplier
      value: 1.15
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMin
      modifierType: Multiplier
      value: 1.25
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMax
      modifierType: Multiplier
      value: 1.25
    # A factor of the shot's stamina cost (Attacks.Bullet_GameEffect staminaCost).
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.WeaponEvolutionToStaminaCost
      modifierType: Multiplier
      value: 1.3
