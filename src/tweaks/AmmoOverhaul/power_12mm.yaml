  iconPath: AO_12mm_PlusP

UIIcon.AO_12mm_PlusP:
  $type: UIIcon
  atlasPartName: ao_12mm_plusp
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

Items.AO_Feed_12mm_PlusP:
  $base: Items.AO_Feed_12mm_Ball
  displayName: LocKey#AO-Ammo-12mm-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_12mm_PlusP
  quality: Quality.Uncommon
  statModifiers:
    # Over-pressure: more damage and reach, more kick, and each shot costs more stamina.
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.1
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.EffectiveRange
      modifierType: Multiplier
      value: 1.15
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMin
      modifierType: Multiplier
      value: 1.25
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMax
      modifierType: Multiplier
      value: 1.25
    # A factor of the shot's stamina cost (Attacks.Bullet_GameEffect staminaCost).
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.WeaponEvolutionToStaminaCost
      modifierType: Multiplier
      value: 1.3

