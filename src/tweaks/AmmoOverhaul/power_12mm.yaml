AmmoOverhaul.Power_12mm.selectors: ["Items.AO_Feed_12mm_Ball", "Items.AO_Feed_12mm_Mushrooms", "Items.AO_Feed_12mm_PlusP", "Items.AO_Feed_12mm_SteelCore", "Items.AO_Feed_12mm_Incendiary", "Items.AO_Feed_12mm_Rubber", "Items.AO_Feed_12mm_Hardcast", "Items.AO_Feed_12mm_Penetrator", "Items.AO_Feed_12mm_Match", "Items.AO_Feed_12mm_Toxin", "Items.AO_Feed_12mm_Shredders", "Items.AO_Feed_12mm_CookOff"]
