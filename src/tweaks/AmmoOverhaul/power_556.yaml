# Power 5.56 (P-556): Umbra, Masamune (Masamune_2020: the Arasaka quest ones), Copperhead, Defender.
# Common 5.56 Ball is vanilla rifle ammo (renamed in core.yaml); Uncommon 5.56 Mushrooms are hollow points.

AmmoOverhaul.Power_556.family: "Power"
AmmoOverhaul.Power_556.weaponTags: ["Umbra", "Masamune", "Masamune_2020", "Copperhead", "Defender"]
AmmoOverhaul.Power_556.feedSlot: "AttachmentSlots.AO_AmmoFeed_Power_556"
AmmoOverhaul.Power_556.feedElement: "Items.AO_AmmoFeed_Power_556_Element"
AmmoOverhaul.Power_556.defaultAmmo: "Ammo.RifleAmmo"
AmmoOverhaul.Power_556.vanillaAmmo: "Ammo.RifleAmmo"
AmmoOverhaul.Power_556.lootWeight: 0.65
AmmoOverhaul.Power_556.selectors: ["Items.AO_Feed_556_Ball", "Items.AO_Feed_556_Mushrooms", "Items.AO_Feed_556_PlusP"]
AmmoOverhaul.Power_556.selectorAmmo: ["Ammo.RifleAmmo", "Ammo.AO_556_HollowPoint", "Ammo.AO_556_PlusP"]
AmmoOverhaul.Power_556.selectorTiers: [0, 1, 1]

# --- Feed slot -------------------------------------------------------------------------------

AttachmentSlots.AO_AmmoFeed_Power_556:
  $base: AttachmentSlots.Power_Handgun_WeaponMod1
  entitySlotName: AO_AmmoFeed_Power_556
  unlockedBy: Common
  localizedName: LocKey#AO-Slot-AmmoFeed

# No quality prereq, so the slot exists on every quality of the gun.
Items.AO_AmmoFeed_Power_556_Element:
  $type: ItemBlueprintElement
  slot: AttachmentSlots.AO_AmmoFeed_Power_556

# --- Ammo --------------------------------------------------------------------------------------

Ammo.AO_556_HollowPoint:
  $base: Ammo.RifleAmmo
  # Listed in full rather than inherited, so the weight isn't added twice.
  statModifiers:
    - Ammo.RifleAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.06
  quality: Quality.Uncommon
  # Uncommon: twice the Common round's price (as weapons roughly double per quality).
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  displayName: LocKey#AO-Ammo-556-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_556_Mushrooms
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]

# --- Icons -------------------------------------------------------------------------------------
# Parts of the mod's icon atlas (tools/icons/build.sh packs it into AmmoOverhaul.archive).

UIIcon.AO_556_Ball:
  $type: UIIcon
  atlasPartName: ao_556_ball
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

UIIcon.AO_556_Mushrooms:
  $type: UIIcon
  atlasPartName: ao_556_mushrooms
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

# --- Selectors ---------------------------------------------------------------------------------

Items.AO_Feed_556_Ball:
  $base: Items.Part
  displayName: LocKey#AO-Ammo-556-Ball
  localizedDescription: LocKey#AO-Ammo-556-Ball-Desc
  iconPath: AO_556_Ball
  itemType: ItemType.Prt_Magazine
  quality: Quality.Common
  placementSlots: [AttachmentSlots.AO_AmmoFeed_Power_556]
  tags: [itemPart, AO_AmmoSelector, HideInBackpackUI]
  buyPrice: []
  sellPrice: []

# Hollow points: harder against flesh, the target's armor counts 1.5x (negative penetration).
Items.AO_Feed_556_Mushrooms:
  $base: Items.AO_Feed_556_Ball
  displayName: LocKey#AO-Ammo-556-Mushrooms
  localizedDescription: LocKey#AO-Ammo-Mushrooms-Desc
  iconPath: AO_556_Mushrooms
  quality: Quality.Uncommon
  statModifiers:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.2
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.CanWeaponIgnoreArmor
      modifierType: Additive
      value: -0.5

# --- Second Uncommon: PlusP ---------------------------------------------------------------

Ammo.AO_556_PlusP:
  $base: Ammo.RifleAmmo
  # Listed in full rather than inherited, so the weight isn't added twice.
  statModifiers:
    - Ammo.RifleAmmo_inline0
    - $type: ConstantStatModifier
      statType: BaseStats.Weight
      modifierType: Additive
      value: 0.06
  quality: Quality.Uncommon
  # Uncommon: twice the Common round's price (as weapons roughly double per quality).
  buyPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  sellPrice:
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.Price
      modifierType: Multiplier
      value: 2
  tags: [Ammo, ShowStackPrice, AO_Ammo, AO_Tier_1, AO_Family_Power]
  displayName: LocKey#AO-Ammo-556-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_556_PlusP

UIIcon.AO_556_PlusP:
  $type: UIIcon
  atlasPartName: ao_556_plusp
  atlasResourcePath: ammooverhaul\icons\ao_ammo_icons.inkatlas

Items.AO_Feed_556_PlusP:
  $base: Items.AO_Feed_556_Ball
  displayName: LocKey#AO-Ammo-556-PlusP
  localizedDescription: LocKey#AO-Ammo-PlusP-Desc
  iconPath: AO_556_PlusP
  quality: Quality.Uncommon
  statModifiers:
    # Over-pressure: more damage and reach, more kick, and each shot costs more stamina.
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.DamagePerHit
      modifierType: Multiplier
      value: 1.1
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.EffectiveRange
      modifierType: Multiplier
      value: 1.15
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMin
      modifierType: Multiplier
      value: 1.25
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.RecoilKickMax
      modifierType: Multiplier
      value: 1.25
    # A factor of the shot's stamina cost (Attacks.Bullet_GameEffect staminaCost).
    - !append
      $type: ConstantStatModifier
      statType: BaseStats.WeaponEvolutionToStaminaCost
      modifierType: Multiplier
      value: 1.3
